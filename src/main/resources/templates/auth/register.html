<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Alquiler de casa')}"></head>

<body>
<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center p-5">
        <div class="col-md-6 col-lg-5">
            <form th:action="@{/register}" method="post" class="card shadow-sm p-4" th:object="${user}">

                <!-- LOGO Y TITULO -->
                <div class="text-center mb-4">
                    <a th:href="@{/}" class="text-decoration-none d-inline-block" style="color: #f1461d;">
                        <th:block th:replace="~{layout/logo :: logo(color='#323232', size='80px', titlePosition='bottom', titleClass='logo-text fw-bold fs-2 mt-2')}"></th:block>
                    </a>
                    <h1 class="h5 mt-3 fw-normal text-secondary">Crear cuenta</h1>
                </div>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username"
                           placeholder="pepe666" required th:field="*{username}" min="3" maxlength="100">
                    <label for="username">Username</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email"
                           placeholder="pepe@gmail.com" required th:field="*{email}">
                    <label for="email">Email</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" th:field="*{password}"
                           class="form-control" id="password"
                           required minlength="4">
                    <label for="password">Contraseña</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" th:field="*{passwordConfirm}"
                           class="form-control" id="passwordConfirm"
                           required minlength="4">
                    <label for="passwordConfirm">Repite la contraseña</label>
                </div>

                <button type="submit" class="btn btn-success">Crear cuenta</button>

                <p class="mt-3 text-center small">¿Ya tienes cuenta?
                    <a th:href="@{/login}">Inicia sesión</a>.
                </p>

            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
