<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Alquiler de casa')}"></head>

<body>
<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4 shadow">

    <h1>
        <i class="fa-solid fa-utensils text-primary me-2"></i>Formulario para hacer una reserva
    </h1>

    <form th:action="@{/booking}" method="post" th:object="${booking}">
        <input type="text" th:field="*{id}" readonly />

        <!-- TODO casa precargada -->
<!--        <input type="hidden" th:field="*{userHouse}">-->

        <!--        Estimatedcheckin-->
        <div class="mb-3">
            <label for="estimatedCheckin" class="form-label">Checkin estimado</label>
            <input type="datetime-local" class="form-control" id="estimatedCheckin" th:field="*{estimatedCheckin}" required/>
        </div>

        <!--        Estimatedcheckout-->
        <div class="mb-3">
            <label for="estimatedCheckout" class="form-label">Checkin estimado</label>
            <input type="datetime-local" class="form-control" id="estimatedCheckout" th:field="*{estimatedCheckout}" required/>
        </div>

        <!-- TODO Mostrar numero total de noches y precio total cuando el usuario seleccione las fechas -->

<!--                    Id de la casa relacionada-->
        <div class="mb-3">
            <label for="houseId" class="form-label">House id.</label>
            <input type="hidden" class="form-control" id="houseId" th:field="*{userHouse.id}" readonly/>
        </div>

        <div class="mb-3">
            <label for="title" class="form-label">House</label>
            <input type="text" class="form-control" id="title" th:field="*{userHouse.title}" readonly/>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Descripción</label>
            <input type="text" class="form-control" id="description" th:field="*{userHouse.description}" readonly/>
        </div>

        <div class="mb-3">
            <label for="location" class="form-label">Localización</label>
            <input type="text" class="form-control" id="location" th:field="*{userHouse.location}" readonly/>
        </div>

        <div class="mb-3">
            <label for="province" class="form-label">Provincia</label>
            <input type="text" class="form-control" id="province" th:field="*{userHouse.province}" readonly/>
        </div>

        <div class="mb-3">
            <label for="maxGuests" class="form-label">Max.Huéspedes</label>
            <input type="number" class="form-control" id="maxGuests" th:field="*{userHouse.maxGuests}" readonly/>
        </div>

        <div class="mb-3">
            <label for="priceNight" class="form-label">Precio por Noche</label>
            <input type="number" class="form-control" id="priceNight" th:field="*{userHouse.pricePerNight}" readonly/>
        </div>

<!--                        Usuario de la reserva-->

        <!-- Cuando pongmaos Srping Security ya no haría falta este selector -->
        <div class="mb-3">
            <label for="usuarios" class="form-label">Usuario</label>
            <select class="form-select" id="usuarios" th:field="*{userBooking}">
                <option value="" disabled selected>Selecciona un usuario</option>
                <option th:each="usuario : ${usuarios}"
                        th:value="${usuario.id}"
                        th:text="${usuario.username}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i>Guardar</button>
        <a th:href="@{/houses}" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i>Cancelar</a>

</main>


<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
