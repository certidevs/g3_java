<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head(${house.id == null ? 'Publicar Alojamiento' : 'Editar Alojamiento'})}"></head>

<body class="d-flex flex-column min-vh-100 bg-light">
<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 mb-5">
  
  <!-- Enlace de regreso -->
  <div class="mt-4 mb-3">
    <a th:href="@{/houses}" class="text-decoration-none text-muted d-inline-flex align-items-center hover-brand-transition">
      <i class="fa-solid fa-arrow-left me-2"></i> Volver a la lista de casas
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="custom-form-card shadow-sm">
        
        <!-- Cabecera del formulario -->
        <div class="custom-form-header">
          <div class="d-flex align-items-center gap-3">
            <div class="bg-brand bg-opacity-10 text-brand rounded-4 p-3 d-inline-flex align-items-center justify-content-center" style="width: 54px; height: 54px;">
              <i class="fa-solid fa-house-chimney fs-4"></i>
            </div>
            <div>
              <h1 th:text="${house.id == null ? 'Publicar alojamiento' : 'Editar alojamiento'}">Formulario de casa</h1>
              <p>Proporcione los detalles de la propiedad para configurar su anuncio.</p>
            </div>
          </div>
        </div>

        <!-- Mensaje de error general -->
        <div th:if="${error}" class="alert alert-danger mb-4 rounded-3 d-flex align-items-center gap-2">
          <i class="fa-solid fa-circle-exclamation fs-5"></i>
          <span th:text="${error}"></span>
        </div>

        <!-- Formulario -->
        <form th:action="@{/houses}" th:object="${house}" method="post" class="row g-4" enctype="multipart/form-data">
          
          <input type="hidden" th:field="*{id}">
          <input type="hidden" th:field="*{imageUrl}">

          <!-- Subida de Imagen -->
          <div class="col-12 mb-2">
            <label class="form-label-custom d-block mb-2">Imagen de portada</label>
            <div class="file-upload-wrapper">
              <div class="file-upload-info py-2" id="uploadPlaceholderInfo">
                <i class="fa-solid fa-cloud-arrow-up text-brand fs-2 mb-3"></i>
                <p class="mb-1 fw-semibold text-dark">Subir una nueva imagen</p>
                <p class="small text-muted mb-0">Arrastre o seleccione un archivo de imagen (JPG, PNG, WEBP)</p>
              </div>
              <input type="file" name="imageFile" id="imageFileInput" accept="image/*">
              
              <!-- Vista previa de imagen -->
              <div class="mt-3">
                <img th:if="${house.imageUrl != null and !house.imageUrl.isEmpty()}" 
                     th:src="@{'/images/' + ${house.imageUrl}}" 
                     id="imagePreview" 
                     class="file-upload-preview" 
                     alt="Vista previa del alojamiento">
                <img th:unless="${house.imageUrl != null and !house.imageUrl.isEmpty()}" 
                     src="" 
                     id="imagePreview" 
                     class="file-upload-preview d-none" 
                     alt="Vista previa del alojamiento">
              </div>
            </div>
          </div>

          <!-- Nombre de la casa -->
          <div class="col-md-6">
            <label for="name" class="form-label-custom">Nombre del alojamiento</label>
            <input type="text" id="name" th:field="*{title}" class="form-control" placeholder="Ej. Villa Mediterránea con vistas al mar" required>
          </div>

          <!-- Dirección -->
          <div class="col-md-6">
            <label for="address" class="form-label-custom">Dirección / Ubicación</label>
            <input type="text" id="address" th:field="*{location}" class="form-control" placeholder="Ej. Av. de la Playa, 12" required>
          </div>

          <!-- Tipo de Alojamiento -->
          <div class="col-md-3">
            <label for="houseType" class="form-label-custom">Tipo de alojamiento</label>
            <select id="houseType" th:field="*{houseType}" class="form-select" required>
              <option value="">Selecciona tipo</option>
              <option th:each="type : ${houseTypes}" th:value="${type.name()}" th:text="${type.label}"></option>
            </select>
          </div>

          <!-- Provincia -->
          <div class="col-md-3">
            <label for="province" class="form-label-custom">Provincia</label>
            <select id="province" th:field="*{province}" class="form-select" required>
              <option value="">Selecciona provincia</option>
              <option th:each="p : ${provinces}" th:value="${p.name()}" th:text="${p}"></option>
            </select>
          </div>

          <!-- Precio por noche -->
          <div class="col-md-3">
            <label for="pricePerNight" class="form-label-custom">Precio por noche</label>
            <div class="input-group">
              <input type="number" id="pricePerNight" th:field="*{pricePerNight}" class="form-control" placeholder="75" min="1" required style="border-top-right-radius: 0; border-bottom-right-radius: 0;">
              <span class="input-group-text bg-light border-start-0" style="border: 1px solid var(--border-color); border-radius: 0 0.75rem 0.75rem 0; font-weight: 500;">€ / noche</span>
            </div>
          </div>

          <!-- Capacidad máxima -->
          <div class="col-md-3">
            <label for="capacity" class="form-label-custom">Capacidad máxima</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0" style="border: 1px solid var(--border-color); border-radius: 0.75rem 0 0 0.75rem;"><i class="fa-solid fa-users text-muted"></i></span>
              <input type="number" id="capacity" th:field="*{maxGuests}" class="form-control" placeholder="4" min="1" required style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
            </div>
          </div>

          <!-- Descripción -->
          <div class="col-12">
            <label for="floatingTextarea2" class="form-label-custom">Descripción detallada</label>
            <textarea class="form-control" placeholder="Escriba aquí los detalles sobre las habitaciones, equipamiento, vistas y comodidades..." th:field="*{description}" id="floatingTextarea2" style="height: 140px; resize: none;"></textarea>
          </div>

          <!-- Comodidades -->
          <div class="col-12">
            <label class="form-label-custom d-block mb-2"><i class="fa-solid fa-couch me-2"></i>Comodidades y Servicios</label>
            <div class="p-3 border rounded-3 bg-light">
              <div class="row row-cols-2 row-cols-md-3 g-3">
                <div class="col" th:each="amenity : ${allAmenities}">
                  <div class="form-check">
                    <input type="checkbox" 
                           th:field="*{amenities}" 
                           th:value="${amenity.id}" 
                           class="form-check-input" 
                           th:id="'amenity-' + ${amenity.id}">
                    <label class="form-check-label small d-flex align-items-center gap-1" th:for="'amenity-' + ${amenity.id}">
                      <i th:class="'fa-solid fa-' + ${amenity.icon} + ' text-muted me-1'"></i>
                      <span th:text="${amenity.name}">WiFi</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Botones de Acción -->
          <div class="col-12 d-flex justify-content-end gap-3 mt-4">
            <a th:href="@{/houses}" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-medium">
              <i class="fa-solid fa-xmark me-2"></i>Cancelar
            </a>
            <button type="submit" class="btn btn-brand rounded-pill px-5 py-2 fw-medium text-white shadow-sm">
              <i class="fa-regular fa-floppy-disk me-2"></i>Guardar propiedad
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

<!-- Script para la previsualización interactiva de la imagen seleccionada -->
<script>
  document.getElementById('imageFileInput')?.addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('imagePreview');
        if (preview) {
          preview.src = e.target.result;
          preview.classList.remove('d-none');
        }
      }
      reader.readAsDataURL(file);
    }
  });
</script>

</body>
</html>
