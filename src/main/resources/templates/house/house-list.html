<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('CASAS')}"></head>

<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/navbar :: navbar}"></nav>
<main class="container-xl flex-grow-1 my-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <h1 class="mb-0 fw-bold">
            <i class="fa-solid fa-house-chimney text-brand me-2"></i> Alojamientos
        </h1>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/houses/new}"
           class="btn btn-brand fw-bold rounded-pill shadow-sm px-4">
            <i class="fa-solid fa-plus me-1"></i> Publicar Alojamiento
        </a>
    </div>

    <div class="row g-4">
        <!-- Barra Lateral de Filtros -->
        <aside class="col-12 col-lg-3">
            <!-- max-height y overflow-y para que sea scrolleable en pantallas con poca altura -->
            <!-- z-index: 1 para que quede debajo del nav, top: 100px para igualar margen de compra -->
            <div class="card border shadow-sm rounded-4 p-3 sticky-top custom-scrollbar"
                 style="top: 100px; z-index: 1; max-height: calc(100vh - 120px); overflow-y: auto; background-color: #f8f9fc;">
                <h5 class="fw-bold mb-3 border-bottom pb-3"><i class="fa-solid fa-filter me-2 text-brand"></i>Filtros
                </h5>

                <form th:action="@{/houses}" method="get" class="d-flex flex-column">

                    <!-- Botones de Búsqueda -->
                    <div class="d-flex gap-2 mb-3 pb-3 border-bottom order-last order-lg-0 mt-4 mt-lg-0 pt-4 pt-lg-0 border-lg-0">
                        <button type="submit" class="btn btn-brand fw-bold p-2 rounded-3 shadow-sm flex-grow-1">
                            <i class="fa-solid fa-magnifying-glass me-2"></i> Buscar
                        </button>
                        <a th:href="@{/houses}" class="btn btn-clear-filters p-2 rounded-3 shadow-sm d-inline-flex align-items-center justify-content-center"
                           title="Limpiar filtros" style="width: 46px; height: 44px;">
                            <i class="fa-solid fa-eraser"></i>
                        </a>
                    </div>

                    <!-- Estado (Admin) -->
                    <div sec:authorize="hasRole('ADMIN')" class="mb-4 pb-3 border-bottom">
                        <label class="form-label text-dark fw-bold mb-2 small text-brand"><i
                                class="fa-solid fa-shield-halved me-1"></i>Estado (Admin)</label>
                        <select th:name="active"
                                class="form-select border-0 shadow-sm p-2 rounded-3 border border-brand bg-white">
                            <option value="" th:selected="${selectedActive == null}">Todas</option>
                            <option value="true" th:selected="${selectedActive == true}">Solo Activas</option>
                            <option value="false" th:selected="${selectedActive == false}">Solo Inactivas</option>
                        </select>
                    </div>

                    <!-- Favoritas y Alquiladas -->
                    <div sec:authorize="isAuthenticated()" class="mb-4 d-flex flex-column gap-2">
                        <div class="form-check ms-1">
                            <input class="form-check-input border-success" type="checkbox" id="rentedOnly"
                                   th:name="rentedOnly" value="true" th:checked="${selectedRentedOnly}">
                            <label class="form-check-label text-dark fw-bold" for="rentedOnly">
                                <i class="fa-solid fa-clock-rotate-left text-success me-1"></i> Alquiladas anteriormente
                            </label>
                        </div>
                        <div class="form-check ms-1">
                            <input class="form-check-input border-danger" type="checkbox" id="favoritesOnly"
                                   th:name="favoritesOnly" value="true" th:checked="${selectedFavoritesOnly}">
                            <label class="form-check-label text-dark fw-bold" for="favoritesOnly">
                                <i class="fa-solid fa-heart text-danger me-1"></i> Marcadas favoritas
                            </label>
                        </div>
                    </div>

                    <!-- Valoración -->
                    <div class="mb-3">
                        <label class="form-label text-dark fw-bold mb-1 small"><i
                                class="fa-solid fa-star me-1 text-warning"></i>Valoración</label>
                        <select th:name="minRating" class="form-select border-0 shadow-sm p-2 rounded-3">
                            <option value="" th:selected="${selectedMinRating == null}">Todas</option>
                            <option value="0.0" th:selected="${selectedMinRating == 0.0}">Con reseñas</option>
                            <option value="3.0" th:selected="${selectedMinRating == 3.0}">3+ Estrellas</option>
                            <option value="4.0" th:selected="${selectedMinRating == 4.0}">4+ Estrellas</option>
                            <option value="5.0" th:selected="${selectedMinRating == 5.0}">5 Estrellas</option>
                        </select>
                    </div>

                    <!-- Ubicación -->
                    <div class="mb-3">
                        <label class="form-label text-dark fw-bold mb-1 small"><i
                                class="fa-solid fa-map-location-dot me-1"></i>Ubicación</label>
                        <select th:name="province" class="form-select border-0 shadow-sm p-2 rounded-3">
                            <option value="">Todas</option>
                            <option th:each="p : ${provinces}"
                                    th:value="${p.name()}"
                                    th:text="${p}"
                                    th:selected="${p == selectedProvince}"></option>
                        </select>
                    </div>

                    <!-- Capacidad mínima -->
                    <div class="mb-3">
                        <label class="form-label text-dark fw-bold mb-1 small"><i
                                class="fa-solid fa-user-group me-1"></i>Huéspedes</label>
                        <input type="number" min="1" th:name="maxGuests" th:value="${selectedMaxGuests}"
                               class="form-control border-0 shadow-sm p-2 rounded-3" placeholder="Ej. 2"/>
                    </div>

                    <!-- Precio Maximo -->
                    <div class="mb-3">
                        <label class="form-label text-dark fw-bold mb-1 small"><i
                                class="fa-solid fa-euro-sign me-1"></i>Precio Máximo</label>
                        <input type="number" step="1" th:name="pricePerNight" th:value="${selectedPricePerNight}"
                               class="form-control border-0 shadow-sm p-2 rounded-3" placeholder="Ej. 100"/>
                    </div>

                    <!-- Tipo de Alojamiento -->
                    <div class="mb-3">
                        <label class="form-label text-dark fw-bold mb-1 small"><i class="fa-solid fa-building me-1"></i>Tipo</label>
                        <select th:name="houseType" class="form-select border-0 shadow-sm p-2 rounded-3">
                            <option value="">Cualquiera</option>
                            <option th:each="type : ${T(com.demo.model.enums.HouseType).values()}"
                                    th:value="${type}"
                                    th:text="${type.label}"
                                    th:selected="${type == selectedHouseType}"></option>
                        </select>
                    </div>

                    <!-- Comodidades -->
                    <div class="mb-3">
                        <label class="form-label text-dark fw-bold mb-2 small"><i class="fa-solid fa-couch me-1"></i>Comodidades</label>
                        <div class="bg-white p-3 rounded-3 border shadow-sm d-flex flex-column gap-2">
                            <div class="form-check" th:each="amenity : ${allAmenities}">
                                <input type="checkbox" th:name="amenityIds" th:value="${amenity.id}"
                                       th:checked="${selectedAmenityIds != null and selectedAmenityIds.contains(amenity.id)}"
                                       class="form-check-input" th:id="'amenity-' + ${amenity.id}"/>
                                <label class="form-check-label small d-flex align-items-center gap-1"
                                       th:for="'amenity-' + ${amenity.id}">
                                    <i th:class="'fa-solid fa-' + ${amenity.icon} + ' text-muted me-1'"></i>
                                    <span th:text="${amenity.name}">WiFi</span>
                                </label>
                            </div>
                        </div>
                    </div>

                </form>
            </div>
        </aside>

        <!-- Grid de Alojamientos -->
        <div class="col-12 col-lg-9">

            <!-- Vista vacía -->
            <div th:if="${houses.isEmpty()}"
                 class="h-100 d-flex flex-column justify-content-center align-items-center p-4 py-5 bg-light rounded-4 border border-dashed">
                <i class="fa-solid fa-house-circle-xmark fs-1 text-muted mb-3"></i>
                <h5 class="text-muted fw-semibold">No se encontraron alojamientos</h5>
                <p class="text-muted mb-0">Intenta ajustar los filtros de búsqueda.</p>
            </div>

            <div class="row row-cols-1 row-cols-lg-3 g-4">
                <div class="col" th:each="house : ${houses}" th:id="'house-card-' + ${house.id}">
                    <div class="card border h-100 shadow-sm rounded-4 property-card position-relative d-flex flex-column">

                        <!-- Badge Admin Status (Top Left, premium pill) -->
                        <div sec:authorize="hasRole('ADMIN')" class="position-absolute top-0 start-0 m-3 z-3">
                            <span th:if="${house.active}"
                                  class="badge bg-success bg-gradient px-3 py-2 rounded-pill shadow-sm fw-semibold">
                                <i class="fa-solid fa-circle-check me-1"></i> Activa
                            </span>
                            <span th:unless="${house.active}"
                                  class="badge bg-danger bg-gradient px-3 py-2 rounded-pill shadow-sm fw-semibold">
                                <i class="fa-solid fa-circle-xmark me-1"></i> Inactiva
                            </span>
                        </div>
                        <a th:href="@{/houses/{id}(id=${house.id})}" class="text-decoration-none d-block">
                            <img th:src="@{'/images/' + ${house.imageUrl}}" class="card-img-top rounded-top-4"
                                 alt="House Image" style="height: 220px; object-fit: cover;"
                                 th:styleappend="${!house.active} ? 'filter: grayscale(1) opacity(0.5);' : ''">
                        </a>
                        <div class="card-body p-4 d-flex flex-column flex-grow-1">
                            <a th:href="@{/houses/{id}(id=${house.id})}"
                               class="text-decoration-none text-dark mb-2 stretched-link">
                                <h5 class="fw-bold text-dark"
                                    style="min-height: 2.8rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"
                                    th:text="${house.title}">Nombre de la Casa</h5>
                            </a>

                            <!-- Rating -->
                            <div class="d-flex align-items-center mb-2">
                                <span th:if="${house.reviewCount() > 0}"
                                      class="d-flex align-items-center fw-bold small text-dark">
                                    <i class="fa-solid fa-star text-warning me-1"></i> <span
                                        th:text="${#numbers.formatDecimal(house.averageRating(), 1, 1)}">5.0</span>
                                </span>
                                <span th:if="${house.reviewCount() == 0}"
                                      class="text-muted small fw-semibold d-flex align-items-center">
                                    <i class="fa-solid fa-star-half-stroke me-1"></i> Sin reseñas
                                </span>
                            </div>

                            <!-- Specs info -->
                            <div class="text-muted small mb-2 d-flex align-items-center flex-wrap gap-1">
                                <span class="text-nowrap"><i class="fa-solid fa-location-dot me-1"></i><span
                                        th:text="${house.province}">Provincia</span></span>
                                <span class="text-muted mx-1">•</span>
                                <span class="text-nowrap"><span
                                        th:text="${house.houseType != null ? house.houseType.label : 'Alojamiento'}">Tipo</span></span>
                            </div>
                            <div th:if="${house.maxGuests != null}"
                                 class="text-muted small mb-3 d-flex align-items-center">
                                <i class="fa-solid fa-user-group me-2 text-secondary"></i>
                                <span>Hasta <span class="fw-semibold text-dark"
                                                  th:text="${house.maxGuests}">2</span> <span
                                        th:text="${house.maxGuests == 1} ? 'huésped' : 'huéspedes'">huéspedes</span></span>
                            </div>

                            <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <span class="fw-bold text-dark fs-5 mb-0"
                                          th:text="${house.pricePerNight} + ' €'">0 €</span>
                                    <span class="text-muted small ms-1 mb-0">/ noche</span>
                                </div>
                                <form sec:authorize="isAuthenticated()" th:action="@{/favorites/toggle}"
                                      method="post" class="m-0 p-0 position-relative z-3">
                                    <input type="hidden" name="id" th:value="${house.id}"/>
                                    <input type="hidden" name="redirectUrl"
                                           th:value="'/houses#house-card-' + ${house.id}"/>
                                    <button type="submit"
                                            class="btn btn-sm btn-link text-decoration-none p-0 favorite-btn"
                                            th:title="${favoritesHouses != null and favoritesHouses.contains(house.id)} ? 'Quitar de favoritos' : 'Agregar a favoritos'"
                                            th:classappend="${favoritesHouses != null and favoritesHouses.contains(house.id)} ? 'text-danger' : 'text-secondary'">
                                        <i th:class="${favoritesHouses != null and favoritesHouses.contains(house.id)} ? 'fa-solid fa-heart fs-3' : 'fa-regular fa-heart fs-3'"></i>
                                    </button>

                                </form>
                                <div sec:authorize="!isAuthenticated()" class="m-0 p-0 position-relative z-3">
                                    <a th:href="@{/login}"
                                       class="btn btn-sm btn-link text-decoration-none p-0 text-secondary favorite-btn"
                                       title="Inicia sesión para guardar en favoritos">
                                        <i class="fa-regular fa-heart fs-3"></i>
                                    </a>
                                </div>
                            </div>

                            <div class="mt-3 position-relative z-3">
                                <a th:href="@{/orders/new(houseId=${house.id})}"
                                   class="btn btn-brand w-100 fw-bold rounded-3"
                                   th:classappend="${!house.active} ? 'disabled' : ''">
                                    Reservar ahora
                                </a>
                            </div>
                        </div>

                        <!-- Admin Actions -->
                        <div sec:authorize="hasRole('ADMIN')"
                             class="card-footer bg-light border-0 pb-3 px-4 position-relative z-3 rounded-bottom-4 border-top">

                            <p class="text-muted small fw-bold mb-2 text-center"><i class="fa-solid fa-gear me-1"></i>
                                Acciones de administrador</p>
                            <div class="d-flex gap-2 flex-column">
                                <a th:href="@{/houses/edit/{id}(id=${house.id})}" class="btn btn-outline-success">
                                    <i class="fa-solid fa-pencil me-1"></i> Editar
                                </a>
                                <a th:if="${house.active}" th:href="@{/houses/deactivate/{id}(id=${house.id})}"
                                   class="btn btn-outline-danger"
                                   onclick="return confirm('¿Seguro que quieres desactivar esta casa?');">
                                    <i class="fa-solid fa-ban me-1"></i> Desactivar
                                </a>
                                <a th:unless="${house.active}" th:href="@{/houses/activate/{id}(id=${house.id})}"
                                   class="btn btn-outline-primary"
                                   onclick="return confirm('¿Seguro que quieres activar esta casa?');">
                                    <i class="fa-solid fa-check me-1"></i> Activar
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
