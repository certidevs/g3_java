<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head('Detalles de casa')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1">

    <!-- Cabecera del restaurante -->
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h1 class="mb-2" th:text="${house.title}">Nombre</h1>

            <a sec:authorize="hasRole('ADMIN')" th:href="@{/houses/deactivate/{id}(id=${house.id})}"
               class="btn btn-warning btn-sm mt-1">
                <i class="fa-solid fa-ban me-1"></i> Desactivar
            </a>

            <a sec:authorize="hasRole('ADMIN')" th:href="@{/houses/edit/{id}(id=${house.id})}"
               class="btn btn-success btn-sm mt-1">
                <i class="fa-solid fa-pencil me-1"></i> Editar
            </a>
            <!-- TODO Reservar -->
            <a th:href="@{/orders/new(houseId=${house.id})}"
                class="btn btn-success btn-sm mt-1">
                <i class="fa-solid fa-pencil me-1"></i> Reservar
            </a>
            <!-- /bookings?houseId=1 -->
<!--            <a class="btn btn-success" th:href="@{/reviews/new(restaurantId=${restaurant.id})}">-->
<!--                <i class="fa-solid fa-plus"></i> Escribir reseña-->
<!--            </a>-->
        </div>
        <div class="mt-4" >
            <span class="badge bg-info text-dark me-1" th:if="${house.maxGuests != null}" th:text="${'Disponible para ' + house.maxGuests + ' personas'}"></span>
            <span class="badge bg-secondary me-1" th:unless="${house.maxGuests != null}">Sin capacidad</span>
            <span th:if="${house.active}" class="badge bg-success fs-6">
            <i class="fa-solid fa-door-open me-1"></i> DISPONIBLE
        </span>
            <span th:unless="${house.active}" class="badge bg-danger fs-6">
            <i class="fa-solid fa-door-closed me-1"></i> NO DISPONIBLE
        </span>
        </div>

    </div>
    <!-- DETALLES DE CASA -->
    <h2 class="mt-4">
        <i class="fa-regular fa-house"></i> Detalles
    </h2>

    <!-- TODO mostrar imagen de la casa -->
<!--    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 mt-1">-->
<!--        <div class="col" th:each="house : ${houses}">-->
<!--            <div class="card card-restaurant h-100 shadow-sm">-->
                <img th:src="@{'/images/' + ${house.imageUrl}}"
                     class="card-img-top"
                     alt="Imagen de la casa"
                     style="height: 200px; object-fit: cover;">

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table table-borderless">
            <tr>
<!--                <th>Id</th>-->
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Tipo</th>
                <th>Capacidad Maxima</th>
            </tr>
            </thead>
            <tbody>
            <tr >
<!--                th:each="house : ${houses}"-->
<!--                <td th:text="${house.id}"></td>-->
                <td class="fw-semibold" th:text="${house.title}"></td>
                <td class="text-muted small" th:text="${house.description}"></td>
                <td>
                    <span class="badge bg-success" th:text="${house.pricePerNight} + ' €'"></span>
                </td>
                <td>
                    <span class="badge bg-light text-dark border" th:text="${house.houseType != null ? house.houseType : 'Sin tipo'}"></span>
                </td>
                <td class="text-muted small" th:text="${house.maxGuests}"> </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- TODO lista de amenities de la casa amenityRepository.findByHouseId() -->
<!-- Por cada amenity hay que renderizar su icon como icono de font awesome y tambien mostrar nombre del amenity -->
<!-- <i class="fa-solid fa-soap"></i> -->
    <!-- CARACTERÍSTICAS Y UBICACIONES -->
    <section class="section">
        <h2>🌟 Qué incluye esta casa</h2>
        <div class="features-grid">
            <div class="feature-card"
                 th:each="amenity : ${house.amenities}">
                <i th:class="'fa-solid fa-' + ${amenity.icon}"></i>
                <h4 th:text="${amenity.name}"></h4>
                <p th:text="${amenity.description}"></p>
            </div>
        </div>
    </section>

    <!-- Opiniones -->
    <h2 id="reviews" class="mt-5">
        <i class="fa-regular fa-comments text-primary me-2"></i> Opiniones de nuestros clientes
    </h2>

    <div th:if="${review_message}" class="alert alert-success fade show alert-dismissible" role="alert">
        <i class="fa-solid fa-check-circle"></i>
        <span th:text="${review_message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <a class="btn btn-success mb-3"  th:href="@{/reviews/new(houseId=${house.id})}">
        <i class="fa-solid fa-plus"></i> Escribir reseña
    </a>

    <div th:if="${#lists.isEmpty(reviews)}" class="alert alert-light border">
        <i class="fa-regular fa-face-smile me-1"></i>
        Nadie ha comentado todavía, sé el primero en escribir una opinión.
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-3" th:unless="${#lists.isEmpty(reviews)}">
        <div class="col" th:each="review : ${reviews}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${review.title}">Título</h5>
                    <p class="card-text" th:text="${review.comment}">Descripción</p>
                    <span class="badge bg-warning text-dark">
                        <i class="fa-solid fa-star me-1"></i>
                        <span th:text="${review.rating + ' / 5'}"></span>
                    </span>
                </div>
                <div class="card-footer text-muted small bg-transparent">
                    <i class="fa-regular fa-calendar me-1"></i>
                    <span th:text="${review.createdAt}"></span>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
