<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Detalle Reseña')}"></head>

<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a th:href="@{/reviews}" class="text-decoration-none">
                    <i class="fa-regular fa-comments me-1"></i>Reseñas
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
                Reseña #<span th:text="${review.id}"></span>
            </li>
        </ol>
    </nav>

    <div class="row g-4 mb-4">
        <div class="col-lg-8">
            <!-- Tarjeta de la Reseña -->
            <div class="card shadow-sm border-0 h-100 rounded-4 p-2 property-card">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-4">
                        <div class="d-flex align-items-center gap-3">
                            <a th:if="${review.user != null}" th:href="@{/users/{id}(id=${review.user.id})}" class="text-decoration-none">
                                <div class="bg-brand text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px;">
                                    <i class="fa-regular fa-user fa-2x"></i>
                                </div>
                            </a>
                            <div th:unless="${review.user != null}">
                                <div class="bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px;">
                                    <i class="fa-regular fa-user fa-2x"></i>
                                </div>
                            </div>
                            <div>
                                <div th:if="${review.user != null}">
                                    <a th:href="@{/users/{id}(id=${review.user.id})}" class="fw-bold text-dark text-decoration-none fs-5 d-block" 
                                       th:text="${review.user.firstName != null and review.user.lastName != null ? review.user.firstName + ' ' + review.user.lastName : review.user.username}">Usuario</a>
                                </div>
                                <div th:unless="${review.user != null}">
                                    <span class="fw-bold text-dark fs-5 mb-0 d-block">Usuario anónimo</span>
                                </div>
                                <div class="text-muted small">
                                    <i class="fa-regular fa-calendar me-1"></i> Publicado el <span th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                                </div>
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="mb-1 text-warning d-flex align-items-center justify-content-end gap-1">
                                <div><i class="fa-solid fa-star fs-6 fs-md-5" th:each="i : ${#numbers.sequence(1, review.rating)}" th:if="${review.rating > 0}"></i><i class="fa-regular fa-star fs-6 fs-md-5" th:each="i : ${#numbers.sequence(review.rating + 1, 5)}" th:if="${review.rating < 5}"></i></div>
                                <span class="fw-bold ms-1" th:text="|${review.rating}.0/5.0|">5.0/5.0</span>
                            </div>
                        </div>
                    </div>
                    
                    <h2 class="fw-bold mb-3" th:text="${review.title}">Título</h2>
                    <p class="card-text fs-5 lh-base text-secondary mb-4 flex-grow-1" th:text="${review.comment}">Descripción</p>
                    <div class="d-flex flex-wrap gap-2 justify-content-end mt-auto pt-3 border-top">
                        <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')') or (#authentication.principal != null and review.user != null and #authentication.principal.id == review.user.id)}">
                            <a th:href="@{/reviews/edit/{id}(id=${review.id})}" class="btn btn-outline-success">
                                <i class="fa-solid fa-pencil me-1"></i> Editar
                            </a>
                            <a th:href="@{/reviews/delete/{id}(id=${review.id})}" class="btn btn-outline-danger" onclick="return confirm('¿Seguro que quieres borrar esta reseña?');">
                                <i class="fa-solid fa-trash me-1"></i> Borrar
                            </a>
                        </th:block>
                        <a class="btn btn-outline-dark" th:if="${review.house != null}" th:href="@{|/houses/${review.house.id}#review-${review.id}|}">
                            <i class="fa-solid fa-eye me-1"></i> Ver en la casa
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4" th:if="${review.house != null}">
            <!-- Previsualización de la Casa -->
            <div class="card border-0 shadow-sm rounded-4 property-card d-flex flex-column mb-auto">
                <a th:href="@{/houses/{id}(id=${review.house.id})}" class="text-decoration-none text-dark d-block">
                    <img th:src="@{'/images/' + ${review.house.imageUrl}}" class="card-img-top rounded-top-4" style="height: 180px; object-fit: cover;" alt="House Image">
                </a>
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex align-items-center text-muted small mb-2">
                        <i class="fa-solid fa-location-dot me-1"></i>
                        <span th:text="${review.house.location} + ', ' + ${review.house.province}">Ubicación</span>
                    </div>
                    <a th:href="@{/houses/{id}(id=${review.house.id})}" class="text-decoration-none text-dark d-block mb-2">
                        <h5 class="fw-bold mb-0" th:text="${review.house.title}">Nombre de la Casa</h5>
                    </a>
                    <p class="card-text text-muted small text-truncate-2 mb-3" th:text="${review.house.description}">Descripción de la casa.</p>
                    
                    <div class="mt-auto text-end">
                        <span class="fw-bold text-dark fs-5" th:text="${review.house.pricePerNight} + ' €'"></span> <span class="text-muted small">/ noche</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Volver -->
    <div class="mt-4">
        <a th:href="@{/reviews}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver al listado
        </a>
    </div>

</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
