<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Detalle Reseña')}"></head>

<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4">

    <!-- Enlace de regreso -->
    <div class="mt-4 mb-3">
        <a th:href="@{/reviews}" class="text-decoration-none text-muted d-inline-flex align-items-center text-hover-brand">
            <i class="fa-solid fa-arrow-left me-2"></i> Volver a reseñas
        </a>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-lg-8">
            <!-- Tarjeta de la Reseña -->
            <div class="card shadow-sm border-0 h-100 rounded-4 p-2 property-card">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-4">
                        <div class="d-flex align-items-center gap-3">
                            <a th:if="${review.user != null}" th:href="@{/users/{id}(id=${review.user.id})}" class="text-decoration-none">
                                <div class="bg-brand text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px;">
                                    <i class="fa-regular fa-user fa-2x"></i>
                                </div>
                            </a>
                            <div th:unless="${review.user != null}">
                                <div class="bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px;">
                                    <i class="fa-regular fa-user fa-2x"></i>
                                </div>
                            </div>
                            <div>
                                <div th:if="${review.user != null}">
                                    <a th:href="@{/users/{id}(id=${review.user.id})}" class="fw-bold text-dark text-decoration-none fs-5 d-block text-hover-brand" 
                                       th:text="${#strings.isEmpty(review.user.firstName) ? review.user.username : review.user.firstName + ' ' + review.user.lastName}">Usuario</a>
                                </div>
                                <div th:unless="${review.user != null}">
                                    <span class="fw-bold text-dark fs-5 mb-0 d-block">Usuario anónimo</span>
                                </div>
                                <div class="text-muted small">
                                    <i class="fa-regular fa-calendar me-1"></i> Publicado el <span th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                                </div>
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="mb-1 text-warning d-flex align-items-center justify-content-end gap-1">
                                <div><i class="fa-solid fa-star fs-6 fs-md-5" th:each="i : ${#numbers.sequence(1, review.rating)}" th:if="${review.rating > 0}"></i><i class="fa-regular fa-star fs-6 fs-md-5" th:each="i : ${#numbers.sequence(review.rating + 1, 5)}" th:if="${review.rating < 5}"></i></div>
                                <span class="fw-bold ms-1" th:text="|${review.rating}.0/5.0|">5.0/5.0</span>
                            </div>
                        </div>
                    </div>
                    
                    <h2 class="fw-bold mb-3" th:text="${review.title}">Título</h2>
                    <p class="card-text fs-5 lh-base text-secondary mb-4 flex-grow-1" th:text="${review.comment}">Descripción</p>
                    <div class="d-flex flex-wrap gap-2 justify-content-end mt-auto pt-3 border-top">
                        <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')') or (#authentication.principal != null and review.user != null and #authentication.principal.id == review.user.id)}">
                            <a th:href="@{/reviews/edit/{id}(id=${review.id})}" class="btn btn-outline-success">
                                <i class="fa-solid fa-pencil me-1"></i> Editar
                            </a>
                            <a th:href="@{/reviews/delete/{id}(id=${review.id})}" class="btn btn-outline-danger" onclick="return confirm('¿Seguro que quieres borrar esta reseña?');">
                                <i class="fa-solid fa-trash me-1"></i> Borrar
                            </a>
                        </th:block>
                        <a class="btn btn-outline-dark" th:if="${review.house != null}" th:href="@{|/houses/${review.house.id}#review-${review.id}|}">
                            <i class="fa-solid fa-eye me-1"></i> Ver en la casa
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Columna Aside (Detalles del Alojamiento Reservado) -->
        <aside class="col-lg-4" th:if="${review.house != null}">
            <div class="position-sticky" style="top: 2rem;">
                <h4 class="h5 text-muted mb-3 fw-bold text-uppercase letter-spacing-sm">Alojamiento valorado</h4>
                
                <!-- Tarjeta del Alojamiento (estilo house-list) -->
                <div class="card border shadow-sm rounded-4 property-card position-relative d-flex flex-column bg-white">
                    <a th:href="@{/houses/{id}(id=${review.house.id})}" class="text-decoration-none d-block">
                        <img th:src="@{'/images/' + ${review.house.imageUrl}}" class="card-img-top rounded-top-4"
                             alt="Imagen del alojamiento" style="height: 200px; object-fit: cover;">
                    </a>
                    <div class="card-body p-4 d-flex flex-column">
                        <a th:href="@{/houses/{id}(id=${review.house.id})}" class="text-decoration-none text-dark mb-2 stretched-link">
                            <h5 class="fw-bold text-dark mb-2" th:text="${review.house.title}">Nombre de la Casa</h5>
                        </a>

                        <!-- Specs info -->
                        <div class="text-muted small mb-2 d-flex align-items-center flex-wrap gap-1">
                            <span class="text-nowrap"><i class="fa-solid fa-location-dot me-1"></i><span th:text="${review.house.province}">Provincia</span></span>
                            <span class="text-muted mx-1">•</span>
                            <span class="text-nowrap"><span th:text="${review.house.houseType != null ? review.house.houseType.label : 'Alojamiento'}">Tipo</span></span>
                        </div>
                        
                        <!-- Guest capacity -->
                        <div th:if="${review.house.maxGuests != null}" class="text-muted small mb-3 d-flex align-items-center">
                            <i class="fa-solid fa-user-group me-2 text-secondary"></i>
                            <span>Hasta <span class="fw-semibold text-dark" th:text="${review.house.maxGuests}">2</span> <span th:text="${review.house.maxGuests == 1} ? 'huésped' : 'huéspedes'">huéspedes</span></span>
                        </div>

                        <!-- Price summary line -->
                        <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <span class="fw-bold text-dark fs-5 mb-0" th:text="${review.house.pricePerNight} + ' €'">0 €</span>
                                <span class="text-muted small ms-1 mb-0">/ noche</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>



</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>

</body>
</html>
