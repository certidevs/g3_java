<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/head :: head('Vista de las reservas')}"></head>

<body>
<nav th:replace="~{layout/navbar :: navbar}"></nav>

<div class="ms-3 mt-3">
<h2><i class="fa-solid fa-restroom text-primary me-2"></i>Reserva</h2>
</div>
<br>
<div  class="card w-75 mb-3" style="margin-left: 50px;">
    <h5 class="card-title" th:text="| ${booking.userHouse.getTitle()} : ${booking.userHouse.getLocation()} |" >Titulo</h5>
    <p class="card-text" th:text="| ${booking.userHouse.getDescription()} , ${booking.userHouse.getMaxGuests()} personas |">Texto de explicaciones.</p>
    <p class="card-text" th:text="| Precio por noche : ${booking.userHouse.getPricePerNight()} . Provincia : ${booking.userHouse.province}|">Texto de explicaciones.</p>
    <h5 class="card-title" th:text="| Usuario : ${booking.userBooking.username} . ${booking.userBooking.email} |" >Titulo</h5>
    <p class="card-text" th:text="| ${booking.userBooking.firstName} ${booking.userBooking.lastName} |">Texto de explicaciones.</p>
    <h5 class="card-title">Datos reserva : </h5>
    <p class="card-text" th:text="| Estimado checkin y checkout : ${booking.estimatedCheckin} / ${booking.estimatedCheckout} |"></p>
    <p class="card-text" th:text="| Checkin y checkout : ${booking.checkin} / ${booking.checkout}"></p>
    <p class="card-text" th:text="| Nro. de noches : ${booking.numberNights}|"></p>
    <p class="card-text" th:text="| Precio total : ${booking.totalPrice} |"></p>
    <p class="card-title" th:text="| Estado de la reserva : ${booking.statusbooking}|"></p>

    <div sec:authorize="hasRole('ADMIN')" class="card-footer bg-transparent border-0 pt-0">
        <a
             th:href="@{/booking/edit/{id}(id=${booking.id})}"
             class="btn btn-outline-primary btn-sm w-40">
            <i class="fa-solid fa-pen-to-square"></i>Editar</a>
    </div>

</div>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
</body>
</html>
