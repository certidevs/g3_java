<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/head :: head(${booking.id == null ? 'Nueva Reserva' : 'Editar Reserva'})}"></head>

<body>
<nav th:replace="~{layout/navbar :: navbar}"></nav>

<main class="container flex-grow-1 my-4 shadow">

    <h1>
        <i class="fa-solid fa-utensils text-primary me-2"></i>
        <span th:text="${booking.id == null ? 'Formulario para hacer una reserva' : 'Edición de Reserva'}"></span>
    </h1>

    <form th:action="@{/booking}" method="post" th:object="${booking}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{userHouse.id}">

        <!-- Campos para NUEVA reserva -->
        <div th:if="${booking.id == null}">
            <div class="mb-3">
                <label for="estimatedCheckin" class="form-label">Checkin estimado</label>
                <input type="datetime-local" class="form-control" id="estimatedCheckin"
                       name="estimatedCheckin" th:field="*{estimatedCheckin}"
                       onchange="calcularDiferencia('estimatedCheckin', 'estimatedCheckout')" required/>
            </div>
            <div class="mb-3">
                <label for="estimatedCheckout" class="form-label">Checkout estimado</label>
                <input type="datetime-local" class="form-control" id="estimatedCheckout"
                       name="estimatedCheckout" th:field="*{estimatedCheckout}"
                       onchange="calcularDiferencia('estimatedCheckin', 'estimatedCheckout')" required/>
            </div>
        </div>

        <!-- Campos para EDITAR reserva -->
        <div th:if="${booking.id != null}">
            <input type="hidden" id="estimatedCheckinEdit" th:field="*{estimatedCheckin}"/>
            <input type="hidden" id="estimatedCheckoutEdit" th:field="*{estimatedCheckout}"/>
            
            <div class="mb-3">
                <label for="checkin" class="form-label">Checkin definitivo</label>
                <input type="datetime-local" class="form-control" id="checkin"
                       name="checkin" th:field="*{checkin}"
                       onchange="calcularDiferencia('checkin', 'checkout')"/>
            </div>
            <div class="mb-3">
                <label for="checkout" class="form-label">Checkout definitivo</label>
                <input type="datetime-local" class="form-control" id="checkout"
                       name="checkout" th:field="*{checkout}"
                       onchange="calcularDiferencia('checkin', 'checkout')"/>
            </div>

            <div class="mb-3">
                <label for="statusbooking" class="form-label">Estado alquiler</label>
                <select class="form-select" id="statusbooking" th:field="*{statusbooking}">
                    <option value="">Seleccione un estado</option>
                    <option th:each="estado : ${estados}"
                            th:value="${estado}"
                            th:text="${estado}">
                    </option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label for="diasDiferencia" class="form-label">Nro. de noches :</label>
            <input type="number" class="form-control" id="diasDiferencia" readonly/>
        </div>

        <div class="mb-3">
            <label for="priceNight" class="form-label">Precio por Noche (€)</label>
            <input type="number" class="form-control" id="priceNight" th:field="*{userHouse.pricePerNight}" readonly/>
        </div>

        <div class="mb-3">
            <label for="totalPrice" class="form-label">Precio total (€)</label>
            <input type="number" step="0.01" class="form-control" id="totalPrice" readonly/>
        </div>

        <!-- Detalles de la casa -->
        <div class="mb-3">
            <label for="title" class="form-label">House</label>
            <input type="text" class="form-control" id="title" th:field="*{userHouse.title}" readonly/>
        </div>

        <div class="mb-3" th:if="${booking.id == null}">
            <label for="description" class="form-label">Descripción</label>
            <textarea class="form-control" id="description"
                      th:field="*{userHouse.description}"
                      rows="4"
                      readonly></textarea>
        </div>

        <div class="mb-3" th:if="${booking.id == null}">
            <label for="location" class="form-label">Localización</label>
            <input type="text" class="form-control" id="location" th:field="*{userHouse.location}" readonly/>
        </div>

        <div class="mb-3" th:if="${booking.id == null}">
            <label for="province" class="form-label">Provincia</label>
            <input type="text" class="form-control" id="province" th:field="*{userHouse.province}" readonly/>
        </div>

        <div class="mb-3" th:if="${booking.id == null}">
            <label for="maxGuests" class="form-label">Max.Huéspedes</label>
            <input type="number" class="form-control" id="maxGuests" th:field="*{userHouse.maxGuests}" readonly/>
        </div>

        <button type="submit" class="btn btn-success">
            <i class="fa-solid fa-floppy-disk"></i><span th:text="${booking.id == null ? ' Guardar' : ' Actualizar'}"></span>
        </button>
        <a th:href="@{/houses}" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancelar</a>

    </form>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>
<script th:replace="~{layout/footer :: scripts}"></script>
<script>
    // Calcula noches y precio total a partir de las fechas y del precio por noche.
    function calcularDiferencia(idInicio, idFin) {
        try {
            const elInicio = document.getElementById(idInicio);
            const elFin = document.getElementById(idFin);
            if (!elInicio || !elFin) return;

            const fechaInicio = elInicio.value;
            const fechaFin = elFin.value;
            const diasInput = document.getElementById("diasDiferencia");
            const totalInput = document.getElementById("totalPrice");
            const precioNoche = parseFloat(document.getElementById("priceNight").value);

            if (!fechaInicio || !fechaFin) {
                diasInput.value = "";
                totalInput.value = "";
                return;
            }

            const inicio = new Date(fechaInicio);
            const fin = new Date(fechaFin);

            if (isNaN(inicio) || isNaN(fin)) {
                return;
            }

            const diffMs = fin - inicio;

            if (diffMs < 0) {
                diasInput.value = "";
                totalInput.value = "";
                return;
            }

            const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            diasInput.value = diffDias;

            if (!isNaN(precioNoche)) {
                totalInput.value = (diffDias * precioNoche).toFixed(2);
            }
        } catch (error) {
            console.error("Error calculando reserva:", error);
        }
    }
    
    // Llamar al inicio si es edición
    const isEdit = document.getElementById("checkin") !== null;
    if (isEdit) {
        calcularDiferencia('checkin', 'checkout');
    } else {
        calcularDiferencia('estimatedCheckin', 'estimatedCheckout');
    }
</script>
</body>
</html>
