<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="bg-dark text-light mt-auto py-5">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                <h5 class="mb-2">
                    <th:block
                            th:replace="~{layout/logo :: logo(color='#f1461d', size='24px', titlePosition='right', titleClass='logo-text fw-bold fs-5 text-white')}"></th:block>
                </h5>
                <p class="text-secondary small mb-0">
                    <i class="fa-regular fa-copyright"></i> 2026 Rods — Fundación Adecco. Todos los derechos reservados.
                </p>
            </div>
            <div class="col-md-6 text-center text-md-end">
                <a th:href="@{/}" class="text-secondary text-decoration-none me-4 small fw-medium"
                   style="transition: color 0.2s;"
                   onmouseover="this.className='text-white text-decoration-none me-4 small fw-medium'"
                   onmouseout="this.className='text-secondary text-decoration-none me-4 small fw-medium'">Inicio</a>
                <a class="text-secondary text-decoration-none me-3 fs-5 table-hover" href="#"
                   style="transition: color 0.2s;"
                   onmouseover="this.className='text-white text-decoration-none me-3 fs-5'"
                   onmouseout="this.className='text-secondary text-decoration-none me-3 fs-5'"><i
                        class="fa-brands fa-github"></i></a>
                <a class="text-secondary text-decoration-none me-3 fs-5" href="#" style="transition: color 0.2s;"
                   onmouseover="this.className='text-white text-decoration-none me-3 fs-5'"
                   onmouseout="this.className='text-secondary text-decoration-none me-3 fs-5'"><i
                        class="fa-brands fa-x-twitter"></i></a>
                <a class="text-secondary text-decoration-none fs-5" href="#" style="transition: color 0.2s;"
                   onmouseover="this.className='text-white text-decoration-none fs-5'"
                   onmouseout="this.className='text-secondary text-decoration-none fs-5'"><i
                        class="fa-regular fa-envelope"></i></a>
            </div>
        </div>
    </div>
</footer>
<script th:fragment="scripts" th:src="@{/webjars/bootstrap/5.3.8/dist/js/bootstrap.bundle.min.js}" defer></script>
</body>
</html>
