<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="logo"
     th:class="${titlePosition == 'bottom'} ? 'd-inline-flex flex-column align-items-center text-center' : 'd-inline-flex align-items-center gap-2'"
     class="d-inline-flex align-items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 400 400"
         th:style="'width: ' + ${size ?: '40px'} + '; height: ' + ${size ?: '40px'} + '; flex-shrink: 0;'"
         style="width: 40px; height: 40px; flex-shrink: 0;">
        <path d="M 200 80
               L 60 180
               L 100 180
               L 100 300
               L 200 300
               L 200 260
               L 180 260
               L 180 236
               L 200 236
               L 200 212
               L 180 212
               L 180 188
               L 200 188 Z"
              th:attr="fill=${color ?: '#323232'}"
              fill="#323232" />

        <g fill="none" stroke="#f1461d" stroke-width="8" stroke-linejoin="miter" stroke-linecap="butt">
            <polyline points="100,320 260,320 260,110" />
            <polyline points="284,130 284,320 316,320" />
            <line x1="208" y1="80" x2="316" y2="170" />
            <line x1="208" y1="108" x2="316" y2="198" />
            <rect x="212" y="188" width="24" height="24" />
            <rect x="212" y="236" width="24" height="24" />

    </svg>
    <span th:if="${titlePosition != null}"
          th:class="${titleClass ?: 'logo-text fw-bold fs-4'}"
          th:text="'RODS'">
        RODS
    </span>
</div>

</html>
