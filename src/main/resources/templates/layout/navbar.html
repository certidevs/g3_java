<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<body>
<nav th:fragment="navbar" class=" navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);">
    <style>
        .navbar-brand-hover {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s ease;
        }
        .navbar-brand-hover:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 0 6px rgba(241, 70, 29, 0.6));
        }
        .navbar-brand-hover span {
            transition: color 0.2s ease;
        }
        .navbar-brand-hover:hover span {
            color: var(--brand-color, #f1461d) !important;
        }
    </style>
    <div class="container-xxl">
        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center navbar-brand-hover" th:href="@{/}">
            <th:block th:replace="~{layout/logo :: logo(color='white', titlePosition='right')}"></th:block>
        </a>
        
        <!-- Hamburger Button -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fw-medium align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link px-3 d-flex align-items-center" th:href="@{/houses}">
                        <span><i class="fa-solid fa-house-chimney me-1"></i> Casas</span>
                        <span sec:authorize="isAuthenticated()" 
                              th:if="${favoritesHouses != null and not #sets.isEmpty(favoritesHouses)}" 
                              class="badge rounded-pill bg-danger ms-2 d-flex align-items-center" 
                              title="Mis Favoritos">
                            <i class="fa-solid fa-heart me-1"></i>
                            <span th:text="${#sets.size(favoritesHouses)}"></span>
                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3" th:href="@{/reviews}">
                        <i class="fa-solid fa-comments me-1"></i> Reseñas
                    </a>
                </li>

                <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                    <a class="nav-link px-3" th:href="@{/users}">
                        <i class="fa-solid fa-users me-1"></i> Usuarios
                    </a>
                </li>

                <li sec:authorize="isAuthenticated()" class="nav-item">
                    <a class="nav-link px-3" th:href="@{/panel-control/{id}(id=${#authentication.principal.id})}">
                        <i class="fa-solid fa-gauge-high me-1"></i>
                        <span sec:authorize="hasRole('ADMIN')">Panel de Control</span>
                        <span sec:authorize="hasRole('USER')">Panel de Huésped</span>
                    </a>
                </li>

                <li sec:authorize="isAuthenticated()" class="nav-item me-1">
                    <a class="nav-link px-3" th:href="@{/profile}">
                        <i class="fa-solid fa-user me-1"></i> <th:block sec:authentication="name"></th:block>
                    </a>
                </li>
            </ul>
            
            <!-- Action Buttons -->
            <div class="d-flex flex-column flex-lg-row gap-2 ms-lg-3 mt-3 mt-lg-0">
                <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-outline-light rounded-pill px-4 text-decoration-none">
                    <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Iniciar Sesión
                </a>
                <a sec:authorize="!isAuthenticated()" th:href="@{/register}" class="btn btn-brand rounded-pill px-4 fw-medium text-white text-decoration-none">
                    <i class="fa-solid fa-user-plus me-1"></i> Registrarse
                </a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline m-0 p-0">
                    <button type="submit" class="btn btn-outline-light rounded-pill px-4 w-100">
                        <i class="fa-solid fa-arrow-right-from-bracket me-1"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
